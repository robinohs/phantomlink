[package]
name = "phantomlink"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
build = "build.rs"
authors = [
    "Andreas Schmidt <schmidt@depend.uni-saarland.de>",
    "Robin Ohs <ohs@depend.uni-saarland.de>",
    "Gregory Stock <stock@depend.uni-saarland.de>",
]
keywords = [
    "linux",
    "network-emulation",
    "virtual-link",
    "aerospace",
    "command-line",
]
categories = [
    "network-programming",
    "science",
    "aerospace::simulation",
    "command-line-utilities",
    "simulation",
]
readme = "README.md"
repository = "https://github.com/robinohs/phantomlink"
license = "MIT OR Apache-2.0"
description = "phantomlink looks like a multi-hop Internet path, but emulates a virtual end-to-end link"
include = [
    "build.rs",
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.cargo-udeps.ignore]
normal = ["husky-rs"]

[dependencies]
camino = "1.1.10"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.2"
clap_complete_nushell = "4.6.0"
color-eyre = "0.6.3"
core_affinity = "0.8.3"
crossbeam = "0.8.4"
csv = "1.3.1"
ctrlc = { version = "3.4.7", features = ["termination"] }
env_logger = "0.11.10"
etherparse = "0.19.0"
eyre = "0.6.12"
husky-rs = "0.3.2"
libc = "0.2.185"
log = "0.4.27"
netlink-packet-core = "0.7.0"
netlink-packet-sock-diag = { version = "0.4.2", features = ["rich_nlas"] }
netlink-sys = "0.8.7"
nix = { version = "0.31.2", features = ["user"] }
pnet = "0.35.0"
serde = { version = "1.0.219", features = ["derive"] }
shadow-rs = { version = "1.1.1", default-features = false }
spin_sleep = "1.3.1"
tempfile = "3.20.0"
thiserror = "2.0.18"
thread-priority = "3.0.0"
uom = { version = "0.38.0", features = ["si", "serde", "u64"] }

[build-dependencies]
shadow-rs = "1.1.1"
