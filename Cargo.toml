[package]
name = "phantomlink"
version = "0.1.0"
edition = "2021"
build = "build.rs"
authors = [
    "Andreas Schmidt <schmidt@depend.uni-saarland.de>",
    "Robin Ohs <ohs@depend.uni-saarland.de>",
    "Gregory Stock <stock@depend.uni-saarland.de>",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.40" }
clap_complete = "4.5.54"
clap_complete_nushell = "4.5.7"
color-eyre = "0.6.3"
core_affinity = "0.8.3"
crossbeam = "0.8.4"
csv = "1.3.1"
etherparse = "0.18.0"
eyre = "0.6.12"
husky-rs = "0.1.3"
libc = "0.2.171"
log = "0.4.27"
netlink-packet-core = "0.7.0"
netlink-packet-sock-diag = { version = "0.4.2", features = ["rich_nlas"] }
netlink-sys = "0.8.7"
pnet = "0.35.0"
serde = { version = "1.0.219", features = ["derive"] }
shadow-rs = { version = "1.1.1", default-features = false }
spin_sleep = "1.3.1"
stderrlog = "0.6.0"
thiserror = "2.0.12"
thread-priority = "1.2.0"
uom = { version = "0.37.0", features = ["si", "serde", "u64"] }

[build-dependencies]
shadow-rs = "1.1.1"
