name: test
on: [workflow_call]
jobs:
    ensure-cargo-fmt:
        runs-on: ubuntu-latest
        name: 🎨 Format
        steps:
        - uses: actions/checkout@v4
        - run: cargo fmt -- --check

    ensure-cargo-audit:
        runs-on: ubuntu-latest
        name: 🔒 Audit
        steps:
        - uses: cargo-bins/cargo-binstall@main
        - run: cargo binstall cargo-audit
        - uses: actions/checkout@v4
        - run: cargo audit -q
    
    ensure-cargo-test:
        runs-on: ubuntu-latest
        name: 🧪 Test
        steps:
        - uses: actions/checkout@v4
        - run: cargo test

    ensure-cargo-clippy:
        runs-on: ubuntu-latest
        name: 📎 Clippy
        steps:
        - uses: actions/checkout@v4
        - run: cargo clippy